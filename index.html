<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>땅따먹기 — 3D</title>
<style>
  :root{ --fg:#e8eaed; --dim:#9aa0a6; --key:#2b3038; --line:#2a2f38;
         --panel:rgba(14,17,22,.92); --accent:#7fd18b; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;overflow:hidden;background:#0b0d11;color:var(--fg);
       font-family:Pretendard,-apple-system,"Segoe UI",system-ui,sans-serif;
       -webkit-user-select:none;user-select:none}
  canvas{display:block}
  button{font:inherit;color:inherit;cursor:pointer}

  /* ── 전면 화면 (menu · pause · result) ────────── */
  .screen{position:fixed;inset:0;z-index:12;display:none;
          flex-direction:column;align-items:center;justify-content:center;
          gap:18px;padding:24px;text-align:center;
          background:rgba(8,10,14,.86);backdrop-filter:blur(3px)}
  .screen.on{display:flex}
  .screen h1{margin:0;font-size:clamp(28px,7vw,46px);letter-spacing:-.03em;font-weight:700}
  .screen h2{margin:0;font-size:clamp(20px,5vw,30px);letter-spacing:-.02em;font-weight:700}
  .screen p{margin:0;color:var(--dim);font-size:14px;line-height:1.8}

  .btn{padding:14px 22px;min-width:230px;border-radius:10px;
       border:1px solid var(--line);background:#161a21;
       font-size:15px;font-weight:600;transition:.12s}
  .btn:hover{background:#1e242d;border-color:#3a414d;transform:translateY(-1px)}
  .btn:active{transform:none}
  .btn.primary{background:#1d2a20;border-color:#33553a}
  .btn.primary:hover{background:#243425}
  .btn .sub{display:block;margin-top:3px;font-size:12px;font-weight:400;color:var(--dim)}
  .btns{display:flex;flex-direction:column;gap:12px;margin-top:8px}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .btn[disabled]:hover{background:#161a21;border-color:var(--line);transform:none}
  .field{width:min(340px,80vw);padding:13px 15px;border-radius:9px;font:inherit;font-size:15px;
         color:var(--fg);background:#12151b;border:1px solid var(--line);text-align:center}
  .field:focus{outline:none;border-color:#4a6b8a;background:#141922}
  .opts{display:flex;flex-direction:column;gap:10px;width:min(380px,86vw);margin-top:2px}
  .opt{display:flex;align-items:center;gap:12px}
  .opt .lb{width:88px;text-align:left;font-size:13px;color:var(--dim);flex:none}
  .seg{flex:1;display:flex;gap:6px}
  .seg button{flex:1;padding:9px 0;border-radius:7px;font:inherit;font-size:13px;font-weight:600;
              color:var(--dim);background:#12151b;border:1px solid var(--line);transition:.12s}
  .seg button:hover{color:var(--fg);border-color:#3a414d}
  .seg button.on{background:#1d2a20;border-color:#33553a;color:var(--fg)}
  .setting{font-size:12.5px;color:var(--dim)}
  .setting b{color:var(--fg);font-weight:600}

  /* 순위표 */
  .rank{display:flex;flex-direction:column;gap:7px;width:100%;max-width:340px;margin-top:4px}
  .rank .row{display:flex;align-items:center;gap:11px;padding:10px 13px;
             border:1px solid var(--line);border-radius:9px;background:#12151b;font-size:14px}
  .rank .row.me{border-color:#3d5a86;background:#131b26}
  .rank .no{width:16px;color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
  .rank .dot{width:11px;height:11px;border-radius:3px;flex:none}
  .rank .nm{flex:1;text-align:left;font-weight:600}
  .rank .pc{font-variant-numeric:tabular-nums;color:var(--dim)}

  /* ── 게임 HUD ────────────────────────────────── */
  #hud{position:fixed;left:0;right:0;bottom:0;padding:12px 16px;z-index:5;
       display:none;flex-wrap:wrap;gap:8px 18px;align-items:center;
       font-size:12px;color:var(--dim);pointer-events:none;
       background:linear-gradient(transparent,rgba(0,0,0,.55))}
  #hud.on{display:flex}
  #hud b{color:var(--fg);font-weight:600;background:var(--key);
         border-radius:4px;padding:1px 6px;margin:0 1px}
  #hud .only-lobby,#hud .only-game{display:none}
  #hud.lobby .only-lobby{display:inline}
  #hud.game .only-game{display:inline}
  #stat{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}

  /* 점수판 (좌상단) */
  #score{position:fixed;left:14px;top:14px;z-index:6;display:none;
         flex-direction:column;gap:5px;padding:10px 12px;border-radius:10px;
         border:1px solid var(--line);background:var(--panel);
         font-size:12.5px;pointer-events:none;min-width:172px}
  #score.on{display:flex}
  #score .r{display:flex;align-items:center;gap:8px}
  #score .r.me .nm{color:var(--fg);font-weight:700}
  #score .dot{width:10px;height:10px;border-radius:3px;flex:none}
  #score .nm{flex:1;color:var(--dim)}
  #score .pc{font-variant-numeric:tabular-nums;color:var(--fg)}
  #score .r.dead .nm,#score .r.dead .pc{opacity:.4}

  /* 타이머 (상단 중앙) */
  #timer{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:6;
         display:none;padding:7px 16px;border-radius:99px;
         border:1px solid var(--line);background:var(--panel);
         font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;pointer-events:none}
  #timer.on{display:block}
  #timer.warn{color:#ff8a8a;border-color:#5a2f2f}

  /* 미니맵 (우상단) */
  #map{position:fixed;right:14px;top:14px;z-index:6;display:none;
       border:1px solid var(--line);border-radius:10px;background:#0d1015}
  #map.on{display:block}

  /* 킬로그 (미니맵 아래) */
  #feed{position:fixed;right:14px;top:206px;z-index:6;display:none;
        flex-direction:column;gap:5px;width:180px;pointer-events:none}
  #feed.on{display:flex}
  #feed .f{padding:7px 10px;border-radius:7px;font-size:11.5px;line-height:1.45;
           border:1px solid var(--line);background:var(--panel)}
  #feed .f .nm{font-weight:700}
  #feed .f .why{color:var(--dim)}

  #cross{position:fixed;left:50%;top:50%;width:14px;height:14px;z-index:5;
         margin:-7px 0 0 -7px;pointer-events:none;opacity:.75;display:none}
  #cross.on{display:block}
  #cross::before,#cross::after{content:"";position:absolute;background:#fff}
  #cross::before{left:6px;top:0;width:2px;height:14px}
  #cross::after{top:6px;left:0;height:2px;width:14px}

  /* ── 로비 UI ─────────────────────────────────── */
  #lobbybar{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:5;
            display:none;gap:14px;align-items:center;white-space:nowrap;
            padding:9px 16px;border-radius:99px;font-size:12.5px;
            border:1px solid #4a3a22;background:rgba(35,26,16,.92);color:#e6c88a;
            pointer-events:none}
  #lobbybar.on{display:flex}
  #lobbybar .sep{width:1px;height:13px;background:#4a3a22}
  #lobbybar .hint{color:var(--dim)}
  #lobbybar #netstate.ok{color:var(--accent)}
  #lobbybar #netstate.bad{color:#ff8a8a}
  #lobbybar .hint b{color:var(--fg);background:var(--key);border-radius:4px;padding:1px 6px}

  #prompt{position:fixed;left:50%;top:calc(50% + 42px);transform:translateX(-50%);z-index:6;
          display:none;align-items:center;gap:10px;white-space:nowrap;
          padding:10px 16px;border-radius:9px;font-size:14px;
          border:1px solid var(--line);background:var(--panel);pointer-events:none}
  #prompt.on{display:flex}
  #prompt .k{font-weight:700;background:var(--key);border-radius:4px;padding:2px 8px;font-size:13px}
  #prompt .meta{color:var(--dim);font-size:12.5px}

  #toast{position:fixed;left:50%;bottom:76px;transform:translate(-50%,10px);z-index:30;
         padding:11px 18px;border-radius:8px;font-size:13px;
         border:1px solid var(--line);background:var(--panel);
         opacity:0;pointer-events:none;transition:.18s}
  #toast.on{opacity:1;transform:translate(-50%,0)}

  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
       padding:24px;text-align:center;background:#0b0d11;z-index:40;font-size:14px;line-height:1.8}
</style>
</head>
<body>

<div id="cross"></div>
<div id="score"></div>
<div id="timer"></div>
<canvas id="map" width="180" height="180"></canvas>
<div id="feed"></div>

<div id="hud">
  <span><b>WASD</b> 이동</span>
  <span><b>Shift</b> 달리기</span>
  <span><b>Space</b> 점프</span>
  <span class="only-lobby"><b>E</b> 상호작용</span>
  <span class="only-lobby"><b>ESC</b> 메뉴로</span>
  <span class="only-game"><b>ESC</b> 일시정지</span>
  <span id="stat"></span>
</div>

<div id="lobbybar">
  <span id="netstate">연결 중…</span>
  <span class="sep"></span>
  <span class="hint">문 앞으로 걸어가 <b>E</b> · 나가려면 <b>ESC</b></span>
</div>

<div id="prompt"><span class="k">E</span><span id="prompt-text"></span><span class="meta" id="prompt-meta"></span></div>

<section id="screen-menu" class="screen on">
  <h1>땅따먹기</h1>
  <p>3D 영역 점령 게임 · 개발 중</p>
  <div class="btns">
    <button class="btn primary" id="btn-bot">봇과 플레이<span class="sub">봇 3명과 3분 승부</span></button>
    <button class="btn" id="btn-online">온라인으로 플레이<span class="sub">로비를 걸어다니며 방 찾기</span></button>
  </div>
</section>

<section id="screen-pause" class="screen">
  <h2 id="pause-title">일시정지</h2>
  <p id="pause-text">마우스 잠금이 해제되었습니다</p>
  <div class="btns">
    <button class="btn primary" id="btn-resume">계속하기</button>
    <button class="btn" id="btn-tomenu">메뉴로 나가기</button>
  </div>
</section>

<section id="screen-create" class="screen">
  <h2>방 만들기</h2>
  <p>이름과 규칙을 정하세요</p>
  <input id="create-name" class="field" maxlength="20" autocomplete="off" spellcheck="false">
  <div class="opts">
    <div class="opt"><span class="lb">인원</span><div class="seg" id="opt-max"></div></div>
    <div class="opt"><span class="lb">제한시간</span><div class="seg" id="opt-secs"></div></div>
    <div class="opt"><span class="lb">승리 점령률</span><div class="seg" id="opt-win"></div></div>
  </div>
  <div class="btns">
    <button class="btn primary" id="btn-create-ok">만들기</button>
    <button class="btn" id="btn-create-cancel">취소</button>
  </div>
</section>

<section id="screen-room" class="screen">
  <h2 id="room-name">방</h2>
  <p class="setting" id="room-setting"></p>
  <p id="room-note"></p>
  <div class="rank" id="room-members"></div>
  <div class="btns">
    <button class="btn primary" id="btn-room-start">게임 시작</button>
    <button class="btn" id="btn-room-leave">방 나가기</button>
  </div>
</section>

<section id="screen-result" class="screen">
  <h2 id="result-title">경기 종료</h2>
  <p id="result-sub"></p>
  <div class="rank" id="result-rank"></div>
  <div class="btns">
    <button class="btn primary" id="btn-again">다시하기</button>
    <button class="btn" id="btn-result-menu">메뉴로</button>
  </div>
</section>

<div id="toast"></div>
<div id="err"></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

// ═══ 설정값 ══════════════════════════════════════════════
const EYE   = 1.7, WALK = 6.0, RUN = 11.0, ACCEL = 14.0;
const GRAV  = 25.0, JUMP = 8.0, SENS = 0.0022, MAXDT = 0.05;

const GRID  = 200;              // 격자 한 변 (셀)
const CELL  = 1.5;              // 셀 한 변 (m)
const FIELD = GRID * CELL;      // 맵 물리 크기 300m
const HALF  = FIELD / 2;
const TOTAL = GRID * GRID;

const MATCH_SEC = 180;          // 제한시간 3분
const WIN_SHARE = 0.60;         // 60% 도달 시 즉시 종료
const RESPAWN_SEC = 1.5;        // 사망 후 리스폰 대기
const START_R = 2;              // 시작 영역 반경 (5x5)
const BOT_WALK = WALK, BOT_RUN = RUN;   // 봇도 사람과 같은 걷기/달리기 속도를 쓴다 (15 문서)

const LOBBY = 56, REACH = 3.2;   // 문 슬롯 6개(간격 8.2m)가 들어가려면 40m로는 좁다

// ═══ 렌더러 · 카메라 ═════════════════════════════════════
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1200);
camera.rotation.order = 'YXZ';
camera.position.set(0, EYE, 0);

const MAXANISO = renderer.capabilities.getMaxAnisotropy();

// ═══ 공용 헬퍼 ═══════════════════════════════════════════
function checkerTexture(a, b, tile, span) {
  const S = 128, c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = a; g.fillRect(0, 0, S, S);
  g.fillStyle = b; g.fillRect(0, 0, S / 2, S / 2); g.fillRect(S / 2, S / 2, S / 2, S / 2);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(span / tile, span / tile);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = MAXANISO;
  return t;
}

function roundRect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);         g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

function makeLabel(title, sub, accent) {
  const W = 512, H = 168, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(12,15,20,.88)';
  roundRect(g, 6, 6, W - 12, H - 12, 20); g.fill();
  g.strokeStyle = accent; g.lineWidth = 4; g.stroke();
  g.textAlign = 'center';
  g.fillStyle = '#ffffff'; g.font = 'bold 56px system-ui, sans-serif'; g.fillText(title, W / 2, 76);
  g.fillStyle = '#9aa0a6'; g.font = '36px system-ui, sans-serif';     g.fillText(sub, W / 2, 128);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false }));
  s.scale.set(3.6, 1.18, 1);
  return s;
}

// ═══ 참가자 정의 ═════════════════════════════════════════
// 슬롯 색은 고정이다. 격자 텍스처·미니맵·3D·점수판이 모두 같은 값을 쓴다.
// 슬롯 번호(1~4)가 곧 격자 배열에 저장되는 소유자 id다.
const SLOT_RGB = [[82, 162, 255], [255, 99, 99], [255, 201, 84], [138, 226, 130]];
const CSS_COLOR = SLOT_RGB.map((c) => 'rgb(' + c.join(',') + ')');
const SPECS = SLOT_RGB.map((rgb, k) => ({ id: k + 1, rgb }));   // 텍스처 칠하기용

// ═══ 격자 상태 ═══════════════════════════════════════════
const owner = new Uint8Array(TOTAL);   // 0 = 빈 땅, 1~4 = 소유자 id
const trail = new Uint8Array(TOTAL);   // 0 = 없음, 1~4 = 궤적 주인 id
const pix   = new Uint8Array(TOTAL * 4);
const seen  = new Uint8Array(TOTAL);   // flood-fill 재사용 버퍼
const queue = new Int32Array(TOTAL);   // flood-fill 재사용 큐

const gridTex = new THREE.DataTexture(pix, GRID, GRID, THREE.RGBAFormat);
gridTex.magFilter = THREE.NearestFilter;
gridTex.minFilter = THREE.LinearFilter;
gridTex.colorSpace = THREE.SRGBColorSpace;
gridTex.anisotropy = MAXANISO;

let texDirty = false, trailDirty = false;
let collectDirty = false;              // 방장일 때만 켠다
const dirtySet = new Set();            // 아직 안 보낸 변경 셀

// 격자 좌표 ↔ 월드 좌표
const gxOf = (x) => Math.floor((x + HALF) / CELL);
const gzOf = (z) => Math.floor((z + HALF) / CELL);
const wxOf = (gx) => gx * CELL - HALF + CELL / 2;
const wzOf = (gz) => gz * CELL - HALF + CELL / 2;
const inGrid = (gx, gz) => gx >= 0 && gx < GRID && gz >= 0 && gz < GRID;

// 텍스처 한 칸 다시 칠하기.
// DataTexture는 위아래를 뒤집지 않는다. 평면을 -90° 눕히면 v=0이 월드 +Z가 되므로
// 행 번호는 gz를 뒤집어 쓴다. 이 변환은 여기 한 곳에만 둔다.
function paint(i) {
  const gz = (i / GRID) | 0, gx = i - gz * GRID;
  const p = ((GRID - 1 - gz) * GRID + gx) * 4;
  const t = trail[i], o = owner[i];
  let r, g, b;
  if (t) {                                   // 궤적 — 밝게
    const c = SPECS[t - 1].rgb;
    r = Math.min(255, c[0] + 70); g = Math.min(255, c[1] + 70); b = Math.min(255, c[2] + 70);
  } else if (o) {                            // 점령지 — 진하게
    const c = SPECS[o - 1].rgb;
    r = c[0] * 0.72; g = c[1] * 0.72; b = c[2] * 0.72;
  } else {                                   // 빈 땅 — 체커 잔디
    const dark = ((gx + gz) & 1) === 0;
    r = dark ? 93 : 86; g = dark ? 122 : 114; b = dark ? 78 : 72;
  }
  pix[p] = r; pix[p + 1] = g; pix[p + 2] = b; pix[p + 3] = 255;
  texDirty = true;
  if (collectDirty) dirtySet.add(i);   // 온라인: 방장이 이 목록을 게스트에게 보낸다
}

function paintAll() {
  const keep = collectDirty;
  collectDirty = false;                // 4만 칸을 통째로 큐에 넣으면 안 된다
  for (let i = 0; i < TOTAL; i++) paint(i);
  collectDirty = keep;
  dirtySet.clear();
}

// ═══ 월드 1: 경기장 ══════════════════════════════════════
function buildArena() {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8fb6d9);
  scene.fog = new THREE.Fog(0x8fb6d9, 70, FIELD * 0.85);

  scene.add(new THREE.AmbientLight(0xffffff, 0.62));
  scene.add(new THREE.HemisphereLight(0xbcd8f5, 0x4b6b4a, 0.5));
  const sun = new THREE.DirectionalLight(0xfff3e0, 0.95);
  sun.position.set(60, 90, 40);
  scene.add(sun);

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(FIELD, FIELD),
    new THREE.MeshStandardMaterial({ map: gridTex, roughness: 1 })
  );
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  // 경계 벽
  const WH = 9, T = 1.2;
  const wallMat = new THREE.MeshStandardMaterial({ color: 0x3b4250, roughness: .9 });
  const wallGeo = new THREE.BoxGeometry(FIELD + T * 2, WH, T);
  [[0, -HALF, 0], [0, HALF, 0], [-HALF, 0, Math.PI / 2], [HALF, 0, Math.PI / 2]].forEach(([x, z, ry]) => {
    const w = new THREE.Mesh(wallGeo, wallMat);
    w.position.set(x, WH / 2, z);
    w.rotation.y = ry;
    scene.add(w);
  });

  // 궤적 낮은 벽 — 인스턴싱. 궤적이 바뀔 때만 다시 채운다.
  // 14단계에서 궤적 길이 제한이 없어졌다. 넷이 동시에 크게 둘러도 넘치지 않게 잡는다.
  const TRAIL_CAP = 16384;
  const trailMesh = new THREE.InstancedMesh(
    new THREE.BoxGeometry(CELL, 0.9, CELL),
    new THREE.MeshStandardMaterial({ roughness: .6 }),
    TRAIL_CAP
  );
  trailMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  trailMesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(TRAIL_CAP * 3), 3);
  trailMesh.count = 0;
  trailMesh.frustumCulled = false;
  scene.add(trailMesh);

  // 참가자 몸체
  const bodyGeo = new THREE.BoxGeometry(1.3, 2.2, 1.3);
  const bodies = SPECS.map((s) => {
    const m = new THREE.Mesh(bodyGeo, new THREE.MeshStandardMaterial({
      color: new THREE.Color(s.rgb[0] / 255, s.rgb[1] / 255, s.rgb[2] / 255), roughness: .7,
    }));
    m.position.set(0, 1.1, 0);
    m.visible = false;
    scene.add(m);
    return m;
  });

  return { scene, limit: HALF - 1.2, spawn: new THREE.Vector3(0, EYE, 0), yaw: 0,
           spots: [], trailMesh, bodies, cap: TRAIL_CAP };
}

// ═══ 월드 2: 온라인 로비 ═════════════════════════════════
// 방 목록은 서버에서 실시간으로 온다. 문 오브젝트는 미리 6개 만들어 두고
// 목록이 바뀌면 보이기/라벨만 갈아끼운다 (매번 생성·폐기하면 GC가 튄다).
const SLOT_N = 6;
const STATE_TEXT = { wait: '대기', play: '진행' };
const STATE_COLOR = { wait: 0x7fd18b, play: 0xe0a55a };

// 갱신 가능한 3D 라벨 — 캔버스를 들고 있다가 다시 그린다
function makeSlotLabel() {
  const W = 512, H = 168, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  sprite.scale.set(3.6, 1.18, 1);

  function draw(title, sub, accent) {
    g.clearRect(0, 0, W, H);
    g.fillStyle = 'rgba(12,15,20,.88)';
    roundRect(g, 6, 6, W - 12, H - 12, 20); g.fill();
    g.strokeStyle = accent; g.lineWidth = 4; g.stroke();
    g.textAlign = 'center';
    g.fillStyle = '#ffffff'; g.font = 'bold 52px system-ui, sans-serif'; g.fillText(title, W / 2, 74);
    g.fillStyle = '#9aa0a6'; g.font = '34px system-ui, sans-serif';     g.fillText(sub, W / 2, 126);
    tex.needsUpdate = true;
  }
  return { sprite, draw };
}

function buildLobby() {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x14171d);
  scene.fog = new THREE.Fog(0x14171d, 22, 62);

  scene.add(new THREE.AmbientLight(0xffffff, 0.62));
  scene.add(new THREE.HemisphereLight(0x9fb4d8, 0x30261c, 0.6));

  key.position.set(10, 22, 8);
  scene.add(key);
  // 천장등 3개 — 하나로는 가운데만 밝고 벽이 죽는다
  [[-16, -8], [0, 6], [16, -8]].forEach(([lx, lz]) => {

  const gap = 8.2, startX = -gap * (SLOT_N - 1) / 2, zWall = -half + 4;

  for (let i = 0; i < SLOT_N; i++) {

    frame.position.set(x, 1.8, zWall);

      color: 0x7fd18b, transparent: true, opacity: .5, side: THREE.DoubleSide }));
    face.position.set(x, 1.75, zWall + 0.23);
    const glow = new THREE.PointLight(0x7fd18b, 9, 12, 2);

  // 방 만들기 존
  const cx = 0, cz = half - 5, cc = 0xe0c85a;

  cpad.position.set(cx, 0.08, cz); scene.add(cpad);

    new THREE.MeshBasicMaterial({ color: cc, transparent: true, opacity: .12, side: THREE.DoubleSide }));
  beam.position.set(cx, 2.8, cz); scene.add(beam);
  const cglow = new THREE.PointLight(cc, 8, 14, 2);
  cglow.position.set(cx, 3.2, cz); scene.add(cglow);

  clabel.draw('방 만들기', '새 방을 연다', '#e0c85a');
  clabel.sprite.position.set(cx, 4.6, cz); scene.add(clabel.sprite);

  const createSpot = { kind: 'create', pos: new THREE.Vector3(cx, 0, cz), text: '방 만들기', meta: '' };

  return { scene, limit: half - 1.2, spawn: new THREE.Vector3(0, EYE, half - 22), yaw: 0,

function setSlotVisible(slot, on) {
  slot.pad.visible = on; slot.frame.visible = on; slot.face.visible = on;
  slot.label.sprite.visible = on; slot.glow.visible = on;
  slot.glow.intensity = on ? slot.glow.intensity : 0;
}

const WORLDS = { game: buildArena(), lobby: buildLobby() };
const arena = WORLDS.game;
let world = arena;

// ═══ 참가자 상태 ═════════════════════════════════════════
// 봇전이면 [나 + 봇 3], 온라인이면 방 참가자 N명으로 매 경기 새로 만든다.
function makeEnt(slot, name, bot, netId) {
  return {
    id: slot, name, bot, netId: netId || null, rgb: SLOT_RGB[slot - 1],
    x: 0, z: 0, gx: -1, gz: -1,
    alive: true, respawn: 0, trail: [], cells: 0, deaths: 0,
    dir: 0, tgx: 0, tgz: 0, phase: 'idle', legIdx: 0, legs: [0, 0, 0], turns: [1, 1], legLeft: 0,
    ai: null, shapeName: '', think: 0, rethink: false, huntT: 0,   // 13단계 봇 성격·판단 주기
    running: false, threat: Infinity,                              // 15단계 봇 달리기
    seen: 0, waiting: false, warpT: 0,                             // 17단계 온라인 보고 상태
    preyGx: 0, preyGz: 0, preyI: undefined,
    homeX: 0, homeZ: 0, homeGx: 0, homeGz: 0,
  };
}

let ents = [makeEnt(1, '나', false)];
let me = ents[0];

let matchSecs = MATCH_SEC;      // 이번 경기 제한시간 (방 설정에서 온다)
let matchWin = WIN_SHARE;       // 이번 경기 승리 점령률 (0이면 시간 종료까지)
let matchTime = MATCH_SEC, matchOver = false;

// ═══ 격자 로직 ═══════════════════════════════════════════
function clearTrailOf(ent) {
  for (const i of ent.trail) { if (trail[i] === ent.id) { trail[i] = 0; paint(i); } }
  ent.trail.length = 0;
  trailDirty = true;
}

function clearOwnedOf(ent) {
  for (let i = 0; i < TOTAL; i++) if (owner[i] === ent.id) { owner[i] = 0; paint(i); }
}

function giveBlock(ent, gx, gz) {
  for (let dz = -START_R; dz <= START_R; dz++) {
    for (let dx = -START_R; dx <= START_R; dx++) {
      const x = gx + dx, z = gz + dz;
      if (!inGrid(x, z)) continue;
      const i = z * GRID + x;
      if (trail[i]) { trail[i] = 0; }       // 남의 궤적 위에 겹치면 지운다
      owner[i] = ent.id;
      paint(i);
    }
  }
  ent.homeX = wxOf(gx); ent.homeZ = wzOf(gz);
  ent.homeGx = gx; ent.homeGz = gz;
}

// 궤적이 닫혔을 때만 호출된다. 바깥에서 flood-fill 해서 닿지 않는 칸을 전부 먹는다.
function capture(ent) {
  for (const i of ent.trail) { trail[i] = 0; owner[i] = ent.id; paint(i); }
  ent.trail.length = 0;
  trailDirty = true;

  seen.fill(0);
  let head = 0, tail = 0;
  const push = (i) => { if (!seen[i] && owner[i] !== ent.id) { seen[i] = 1; queue[tail++] = i; } };

  for (let g = 0; g < GRID; g++) {
    push(g);                        // 위 가장자리
    push((GRID - 1) * GRID + g);    // 아래 가장자리
    push(g * GRID);                 // 왼쪽
    push(g * GRID + GRID - 1);      // 오른쪽
  }
  while (head < tail) {
    const i = queue[head++];
    const gz = (i / GRID) | 0, gx = i - gz * GRID;
    if (gx > 0)        push(i - 1);
    if (gx < GRID - 1) push(i + 1);
    if (gz > 0)        push(i - GRID);
    if (gz < GRID - 1) push(i + GRID);
  }

  let gained = 0;
  for (let i = 0; i < TOTAL; i++) {
    if (!seen[i] && owner[i] !== ent.id) {
      owner[i] = ent.id;
      if (trail[i]) {               // 남의 궤적을 가둬버린 경우 — 그 주인은 죽는다
        const victim = ents[trail[i] - 1];
        trail[i] = 0;
        if (victim && victim.alive) kill(victim, ent, ent.name + '에게 포위당함');
      }
      paint(i);
      gained++;
    }
  }
  recount();
  return gained;
}

function kill(ent, by, why) {
  if (!ent || !ent.alive) return;
  ent.alive = false;
  ent.deaths++;
  ent.respawn = RESPAWN_SEC;
  clearTrailOf(ent);
  clearOwnedOf(ent);
  recount();

  const reason = why || (by === ent ? '자기 궤적에 걸림'
                       : by ? by.name + '에게 잡힘' : '사망');
  pushFeed(ent, reason);
  if (online && iamHost) pendingFeed.push([ent.id, reason]);
  if (ent === me) toast(reason);
  else if (by === me) toast(ent.name + '을(를) 잡았습니다');
}

function freeCellNear(gx, gz) {
  for (let r = 4; r <= 40; r += 4) {
    for (let k = 0; k < 24; k++) {
      const a = Math.random() * Math.PI * 2;
      const nx = Math.round(gx + Math.cos(a) * r), nz = Math.round(gz + Math.sin(a) * r);
      if (nx < 3 || nz < 3 || nx > GRID - 4 || nz > GRID - 4) continue;
      const i = nz * GRID + nx;
      if (!owner[i] && !trail[i]) return [nx, nz];
    }
  }
  return null;
}

function randomSpawnCell() {
  for (let k = 0; k < 400; k++) {
    const gx = START_R + 1 + ((Math.random() * (GRID - START_R * 2 - 2)) | 0);
    const gz = START_R + 1 + ((Math.random() * (GRID - START_R * 2 - 2)) | 0);
    const i = gz * GRID + gx;
    if (!owner[i] && !trail[i]) return [gx, gz];
  }
  return [(GRID / 2) | 0, (GRID / 2) | 0];
}

function respawnEnt(ent) {
  const [gx, gz] = freeCellNear(ent.homeGx, ent.homeGz) || randomSpawnCell();
  giveBlock(ent, gx, gz);
  ent.x = wxOf(gx); ent.z = wzOf(gz);
  ent.gx = gx; ent.gz = gz;
  ent.tgx = gx; ent.tgz = gz;
  ent.alive = true;
  ent.phase = 'idle';
  ent.warpT = netNow + 2000;              // 이 시간 안에는 리스폰 자리 근처 보고만 받는다
  if (ent === me) {
    pos.set(ent.x, EYE, ent.z);
    vel.set(0, 0, 0);
    camera.position.copy(pos);
  }
  recount();
}

// 참가자가 새 셀에 들어갔을 때의 판정 — 게임 규칙의 핵심
function stepCell(ent, gx, gz) {
  if (!inGrid(gx, gz)) return;
  if (gx === ent.gx && gz === ent.gz) return;
  ent.gx = gx; ent.gz = gz;

  const i = gz * GRID + gx;

  const t = trail[i];
  if (t) {                                  // 궤적을 밟았다 → 그 궤적 주인이 죽는다
    const victim = ents[t - 1];
    if (victim) kill(victim, ent, t === ent.id ? '자기 궤적에 걸림' : ent.name + '에게 잡힘');
    else { trail[i] = 0; paint(i); }        // 주인이 없는 궤적은 지운다
    if (!ent.alive) return;                 // 자기 궤적이었다면 본인이 죽은 것
  }

  if (owner[i] === ent.id) {
    if (ent.trail.length) capture(ent);     // 집에 돌아왔다 → 점령
  } else {
    trail[i] = ent.id;
    ent.trail.push(i);
    paint(i);
    trailDirty = true;
    // 14단계 — 길이 제한을 없앴다. 얼마든지 크게 둘러도 된다.
    // 크게 두르는 위험은 규칙이 아니라 '봇이 자르러 온다'가 맡는다 (14 문서).
  }
}

// 마지막으로 있던 칸에서 새 칸까지 사이를 모두 채운다.
// 네트워크 지연이나 프레임 저하로 위치 보고가 띄엄띄엄 오면 칸을 건너뛰는데,
// 그러면 궤적에 구멍이 생겨 폐곡선이 닫히지 않고 점령이 통째로 실패한다.
function stepCells(ent, gx, gz) {
  if (!inGrid(gx, gz)) return;
  if (ent.gx < 0) { stepCell(ent, gx, gz); return; }

  let cx = ent.gx, cz = ent.gz;
  if (Math.abs(gx - cx) + Math.abs(gz - cz) > 64) {   // 순간이동(리스폰 등)은 잇지 않는다
    ent.gx = gx; ent.gz = gz;
    stepCell(ent, gx, gz);
    return;
  }

  let guard = 0;
  while ((cx !== gx || cz !== gz) && guard++ < 80) {
    if (Math.abs(gx - cx) >= Math.abs(gz - cz)) cx += Math.sign(gx - cx);
    else cz += Math.sign(gz - cz);
    stepCell(ent, cx, cz);
    if (!ent.alive) return;        // 도중에 죽으면 거기서 멈춘다
  }
}

function recount() {
  for (const e of ents) e.cells = 0;
  for (let i = 0; i < TOTAL; i++) {
    const e = owner[i] ? ents[owner[i] - 1] : null;   // 없는 슬롯 값이 섞여도 죽지 않게
    if (e) e.cells++;
  }
}

function share(ent) { return ent.cells / TOTAL; }

// ═══ 봇 AI ═══════════════════════════════════════════════
// 격자를 따라 한 칸씩 이동한다. 자유 각도로 돌아다니면 자기 궤적에 걸려 자멸하는데,
// 칸 단위로 움직이면 "다음 칸이 내 궤적인가"를 확실히 검사할 수 있다 (07 문서).
//
// 13단계 — 늘 같은 네모만 그리던 문제를 고쳤다.
//   · 봇마다 성격이 다르다 (확장형·사냥꾼·침투형·수비형).
//   · 출격마다 도형을 새로 뽑는다 (네모·넓적·납작·L자·나선·갈고리).
//   · 상황을 본다. 빈 땅이 많은 쪽으로 나가고, 내 땅이 작으면 크게,
//     적이 가까우면 짧게 치고 복귀한다.
//   · 자멸 방지는 오히려 강화했다. "저 칸에 들어가면 집까지 돌아올 길이 남는가"를
//     매 걸음 확인하고, 길이 없으면 그 칸을 아예 고르지 않는다.
const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];
const MAX_TRAIL = 220;    // 성격이 없을 때의 기본 상한
const EDGE = 2;           // 맵 가장자리 여유 (셀). 구석에 몰려 갇히는 걸 막는다
const ROUTE_CAP = 1500;   // 복귀 경로 탐색 상한. 여기까지 뚫려 있으면 갇힌 게 아니다

const dirOf = (dx, dz) => (dx === 1 ? 0 : dx === -1 ? 2 : dz === 1 ? 1 : 3);

// ── 복귀 경로 탐색 ───────────────────────────────────────
// 내 궤적을 밟지 않고 내 땅까지 갈 수 있는가. 갈 수 있으면 첫 걸음의 방향을 준다.
// 스탬프를 쓰므로 매번 40,000칸을 지울 필요가 없다.
//   0~3 = 그 방향으로 한 걸음   4 = 이미 내 땅 위   -1 = 갇혔다   -2 = 넓게 뚫려 있다
const botMark = new Int32Array(TOTAL);
const botPrev = new Int32Array(TOTAL);
const botQ    = new Int32Array(TOTAL);
let botStamp = 0;

function routeHome(b, sx, sz) {
  if (sx < EDGE || sz < EDGE || sx > GRID - 1 - EDGE || sz > GRID - 1 - EDGE) return -1;
  const s = sz * GRID + sx;
  if (trail[s] === b.id) return -1;
  if (owner[s] === b.id) return 4;

  botStamp++;
  let head = 0, tail = 0, n = 0;
  botMark[s] = botStamp; botPrev[s] = -1; botQ[tail++] = s;

  while (head < tail) {
    const i = botQ[head++];
    if (++n > ROUTE_CAP) return -2;          // 이만큼 뚫려 있으면 갇힌 상황이 아니다
    const gz = (i / GRID) | 0, gx = i - gz * GRID;
    for (let d = 0; d < 4; d++) {
      const nx = gx + DIRS[d][0], nz = gz + DIRS[d][1];
      if (nx < EDGE || nz < EDGE || nx > GRID - 1 - EDGE || nz > GRID - 1 - EDGE) continue;
      const j = nz * GRID + nx;
      if (botMark[j] === botStamp) continue;
      if (trail[j] === b.id) continue;       // 내 궤적은 못 지나간다
      botMark[j] = botStamp; botPrev[j] = i;
      if (owner[j] === b.id) {               // 집에 닿았다 — 첫 걸음을 되짚는다
        let c = j, g = 0;
        while (botPrev[c] !== s && botPrev[c] >= 0 && g++ < TOTAL) c = botPrev[c];
        const cz = (c / GRID) | 0, cx = c - cz * GRID;
        return dirOf(cx - sx, cz - sz);
      }
      botQ[tail++] = j;
    }
  }
  return -1;                                  // 돌아갈 길이 없다
}

function nearestFoe(b) {
  let best = Infinity;
  for (const e of ents) {
    if (e === b || !e.alive) continue;
    const d = Math.abs(gxOf(e.x) - b.gx) + Math.abs(gzOf(e.z) - b.gz);
    if (d < best) best = d;
  }
  return best;
}

// 남이 밟는 건 내 몸이 아니라 내 궤적이다. 궤적에 가장 가까이 붙은 적까지의 거리를 본다.
// 이게 실제 위험 신호다 — 이 값이 작으면 길게 늘어놓은 줄이 곧 끊긴다.
// 이 상대는 '지금 잃을 게 없는' 상태인가.
// 자기 땅 위에 서 있고 궤적이 없으면, 튀어나와 남의 꼬리를 밟아도 자기는 아무 손해가 없다.
// 반대로 자기도 궤적을 늘어놓고 있으면 서로 위험하다 — 함부로 달려들지 못한다.
// 이 구분이 16단계의 핵심이다. 사냥 대상이 아닌 것과 위험하지 않은 것은 다르다.
function isSafeFoe(e) {
  if (e.trail.length) return false;
  return owner[gzOf(e.z) * GRID + gxOf(e.x)] === e.id;
}

// 잃을 게 없는 상대가 튀어나와 내 꼬리에 닿을 수 있는 거리 (셀).
// 40칸 = 60m. 달리기 11m/s로 5초 남짓이면 닿는다. 봇이 한 변을 긋고 빠지기에는 빠듯한 시간이다.
// 값을 쓸어 보니 40칸에서 꺾인다 — 더 늘려도 안 잘리는 정도는 그대로고 봇 땅만 줄어든다.
const SORTIE = 40;

// 내 궤적에 가장 가까이 붙은 적까지의 거리. 이게 실제 위험 신호다.
// '잃을 게 없는' 상대는 실제 거리에서 출격 사거리만큼 당겨 본다.
// 제 땅에 가만히 서 있어도 언제든 달려나올 수 있으니, 가만히 있다고 안전한 게 아니다.
function threatToTrail(b) {
  if (!b.trail.length) return Infinity;
  let best = Infinity;
  for (const e of ents) {
    if (e === b || !e.alive) continue;
    const ex = gxOf(e.x), ez = gzOf(e.z);
    const bias = isSafeFoe(e) ? SORTIE : 0;
    for (const i of b.trail) {
      const gz = (i / GRID) | 0, gx = i - gz * GRID;
      const d = Math.abs(gx - ex) + Math.abs(gz - ez) - bias;
      if (d < best) { best = d; if (best <= 1) return best; }
    }
  }
  return best;
}

// 지금 조심해야 할 상대들의 위치. 방향을 고를 때 이쪽으로는 꼬리를 들이밀지 않는다.
function dangerFoes(b) {
  const out = [];
  for (const e of ents) {
    if (e === b || !e.alive) continue;
    out.push([gxOf(e.x), gzOf(e.z), isSafeFoe(e) ? SORTIE : SORTIE * 0.5]);
  }
  return out;
}

// ── 봇 성격 ─────────────────────────────────────────────
// 셋이 똑같이 판단하면 도형만 바꿔도 결국 비슷해 보인다. 배역을 나눠 준다.
//   size 기본 변 길이(셀) · aggr 사냥 의욕 · huntR 사냥 반경 · flee 이 거리 안에 적이 오면 복귀
//   period 판단 주기(초) · whim 방향 선택의 변덕 · sprint 달리기 적극성 · maxTrail 궤적 상한
const BOT_BRAINS = [
  { tag: '확장형', size: 28, aggr: 0.05, huntR: 18, flee: 20, period: 1.8, whim: 0.30,
    sprint: 0.35, maxTrail: 275, shapes: ['네모', '나선', 'L자', '갈고리'] },
  { tag: '사냥꾼', size: 19, aggr: 0.60, huntR: 55, flee: 16, period: 1.1, whim: 0.50,
    sprint: 0.85, maxTrail: 150, shapes: ['네모', '넓적', 'L자'] },
  { tag: '침투형', size: 23, aggr: 0.15, huntR: 30, flee: 18, period: 1.3, whim: 0.60,
    sprint: 0.60, maxTrail: 260, shapes: ['납작', '나선', '갈고리', '넓적'] },
  { tag: '수비형', size: 18, aggr: 0.08, huntR: 20, flee: 24, period: 1.2, whim: 0.25,
    sprint: 0.45, maxTrail: 175, shapes: ['네모', 'L자', '넓적', '나선'] },
];

function assignBrains() {
  const pool = BOT_BRAINS.slice();
  for (let i = pool.length - 1; i > 0; i--) {          // 섞는다 — 매 판 배역이 달라진다
    const k = (Math.random() * (i + 1)) | 0;
    const t = pool[i]; pool[i] = pool[k]; pool[k] = t;
  }
  const jit = (v, p) => v * (1 - p + Math.random() * p * 2);   // 같은 배역도 개체차를 준다
  let n = 0;
  for (const e of ents) {
    if (!e.bot) continue;
    const base = pool[n++ % pool.length];
    e.ai = {
      tag: base.tag,
      size:     Math.max(5, Math.round(jit(base.size, 0.25))),
      aggr:     Math.min(0.95, jit(base.aggr, 0.30)),
      huntR:    Math.round(jit(base.huntR, 0.25)),
      flee:     Math.round(jit(base.flee, 0.30)),
      period:   Math.max(0.25, jit(base.period, 0.35)),
      whim:     base.whim,
      sprint:   Math.min(0.95, jit(base.sprint, 0.25)),   // 달리기 적극성
      maxTrail: Math.round(jit(base.maxTrail, 0.20)),   // 죽는 상한이 아니라 '이쯤이면 돌아간다' 기준
      shapes:   base.shapes,
    };
    e.think = Math.random() * e.ai.period;             // 판단 시점도 서로 어긋나게
  }
}

// ── 도형 뽑기 ───────────────────────────────────────────
// 나갔다가 집으로 돌아오면 그 사이가 점령된다. 나가는 길만 바꿔도 먹는 모양이 통째로 달라진다.
// legs = 각 변의 길이(셀), turns = 변과 변 사이에서 꺾는 방향(+1 우, -1 좌).
function pickShape(b, size) {
  const name = b.ai.shapes[(Math.random() * b.ai.shapes.length) | 0];
  const t = Math.random() < 0.5 ? 1 : -1;
  const L = (m) => Math.max(4, Math.round(size * m * (0.75 + Math.random() * 0.5)));

  if (name === '납작') {                        // 길쭉하게 찔러 넣는다 (침투)
    const a = L(1.8);
    return { name, legs: [a, L(0.5), a], turns: [t, t] };
  }
  if (name === 'L자') {                         // 나가는 변과 돌아오는 변 길이를 다르게
    return { name, legs: [L(1.3), L(1.0), L(0.5)], turns: [t, t] };
  }
  if (name === '나선') {                        // 한 바퀴를 넘겨 크게 돌아 통째로 감싼다
    return { name, legs: [L(0.8), L(0.8), L(1.5), L(1.5)], turns: [t, t, t] };
  }
  if (name === '넓적') {                        // 가로세로 비율을 매번 크게 어긋나게 잡는다
    const w = 0.6 + Math.random() * 1.4;
    const a = L(w);
    return { name, legs: [a, L(2.0 - w), a], turns: [t, t] };
  }
  if (name === '갈고리') {                      // 크게 돌았다가 반대쪽으로 휘어 나간다.
    return { name, legs: [L(1.0), L(0.9), L(1.2), L(0.4)], turns: [t, t, -t] };
  }
  const a = L(1.0);                             // 네모 — 1변과 3변을 같게 (07 문서)
  return { name: '네모', legs: [a, L(1.0), a], turns: [t, t] };
}

// 네 방향을 훑어 점수를 매긴다. 빈 땅이 많은 쪽이 제일 좋고, 벽과 내 궤적 쪽은 피한다.
// 마지막에 변덕을 섞는다 — 같은 자리에서 늘 같은 답이 나오면 다시 단조로워진다.
const DODGE = 6;        // 출격 사거리 안 한 칸당 최대 감점. 너무 크면 확장을 아예 멈춘다

function pickDir(b, size) {
  const span = Math.min(60, 12 + Math.round(size * 1.8));
  const foes = dangerFoes(b);
  let bestD = 0, bestS = -Infinity;
  for (let d = 0; d < 4; d++) {
    let s = 0;
    for (let n = 1; n <= span; n++) {
      const nx = b.gx + DIRS[d][0] * n, nz = b.gz + DIRS[d][1] * n;
      if (nx < EDGE + 1 || nz < EDGE + 1 || nx > GRID - 2 - EDGE || nz > GRID - 2 - EDGE) {
        s -= (span - n + 1) * 1.5;              // 남은 거리만큼 벽 감점
        break;
      }
      const i = nz * GRID + nx;
      if (trail[i] === b.id) s -= 4;            // 내 궤적 쪽으로는 나가지 않는다
      else if (owner[i] === 0) s += 1.4;        // 무소유 빈 땅이 제일 좋다
      else if (owner[i] !== b.id) s += 0.9;     // 남의 땅 — 뺏으면 이득이 크다
      // 상대의 출격 사거리 안이면 감점. 가까울수록 크게 깎는다.
      // 남의 땅이 탐나서 그 주인 코앞에 꼬리를 늘어놓던 게 16단계에서 고친 지점이다.
      for (let k = 0; k < foes.length; k++) {
        const fd = Math.abs(nx - foes[k][0]) + Math.abs(nz - foes[k][1]);
        if (fd < foes[k][2]) s -= (1 - fd / foes[k][2]) * DODGE;
      }
    }
    s += Math.random() * span * b.ai.whim;
    if (s > bestS) { bestS = s; bestD = d; }
  }
  return bestD;
}

function planBot(b) {
  if (!b.ai) assignBrains();
  b.phase = 'out';
  b.legIdx = 0;
  b.huntT = 0;

  // 상황 판단 — 내 땅이 작으면 크게, 적이 가까우면 짧게 치고 빠진다
  let size = b.ai.size;
  const sh = share(b);
  if (sh < 0.05) size *= 1.35;              // 땅이 작다 — 크게 한 번 둘러본다
  else if (sh > 0.22) size *= 0.85;         // 충분히 넓다 — 지키는 쪽으로
  const foe = nearestFoe(b);
  if (foe < 10) size *= 0.7;                // 적이 코앞이다 — 짧게 치고 빠진다
  else if (foe < 20) size *= 0.9;

  b.dir = pickDir(b, size);
  const shape = pickShape(b, size);
  b.legs = shape.legs;
  b.turns = shape.turns;
  b.shapeName = shape.name;
  b.legLeft = b.legs[0];
}

// 잘릴 만한 상대를 찾는다. 사람 플레이어도 똑같이 후보다.
// 궤적을 밟으면 그 주인이 죽고 땅을 전부 잃는다. 그러니 고를 때 보는 건 두 가지다.
//   · 늘어놓은 궤적이 길수록 — 크게 두르는 중이라 손해가 크다
//   · 자기 영역에서 멀리 나와 있을수록 — 집에 못 닿고 죽을 확률이 높다
// 어느 칸을 밟든 결과는 같으므로, 고른 상대의 궤적 중 나한테 제일 가까운 칸을 노린다.
// '노출됐다'의 기준. 둘 중 하나를 넘어야 사냥감이다.
// 이 문턱이 없으면 봇끼리 평소 확장까지 서로 물어뜯어 경기가 망가진다 (14 문서 검증).
const HUNT_AWAY = 100;           // 자기 집에서 이만큼(150m) 나와 있거나
const HUNT_LONG = 160;           // 궤적을 이만큼(240m) 늘어놓았거나

function findPrey(b, radius) {
  let best = null, bestS = 0;
  for (const e of ents) {
    if (e === b || !e.alive) continue;

    const away = Math.abs(gxOf(e.x) - e.homeGx) + Math.abs(gzOf(e.z) - e.homeGz);
    if (away < HUNT_AWAY && e.trail.length < HUNT_LONG) continue;   // 아직 안전권이다

    let ci = -1, cd = radius + 1, cgx = 0, cgz = 0;
    const st = 1 + ((e.trail.length / 400) | 0);     // 궤적이 아주 길면 띄엄띄엄 본다
    for (let k = 0; k < e.trail.length; k += st) {
      const i = e.trail[k];
      const gz = (i / GRID) | 0, gx = i - gz * GRID;
      const d = Math.abs(gx - b.gx) + Math.abs(gz - b.gz);
      if (d < cd) { cd = d; ci = i; cgx = gx; cgz = gz; }
    }
    if (ci < 0) continue;

    const s = Math.min(200, e.trail.length)          // 길게 늘어놓을수록
            + Math.min(120, away) * 1.5              // 집에서 멀리 나와 있을수록
            - cd * 2;                                // 내가 멀수록 깎는다
    if (s > bestS) { bestS = s; best = { gx: cgx, gz: cgz, i: ci, name: e.name }; }
  }
  return best;
}

// 집이 남의 손에 넘어갔을 때 가장 가까운 내 땅을 다시 찾는다 (가끔만 호출)
function retargetHome(b) {
  let best = -1, bestD = Infinity;
  for (let i = 0; i < TOTAL; i++) {
    if (owner[i] !== b.id) continue;
    const gz = (i / GRID) | 0, gx = i - gz * GRID;
    const d = Math.abs(gx - b.gx) + Math.abs(gz - b.gz);
    if (d < bestD) { bestD = d; best = i; }
  }
  if (best >= 0) { b.homeGz = (best / GRID) | 0; b.homeGx = best - b.homeGz * GRID; }
}

// 다음에 들어갈 칸을 고른다. 자기 궤적 칸은 절대 고르지 않고,
// 그 칸에서 집으로 돌아올 길이 남아 있는지까지 확인한다.
function botPick(b) {
  const ai = b.ai || { maxTrail: MAX_TRAIL, aggr: 0.3, huntR: 15, flee: 10, sprint: 0.5 };

  // ── 국면 전환 ──
  if (b.phase === 'out') {
    if (b.legLeft <= 0) {
      b.legIdx++;
      if (b.legIdx < b.legs.length) {
        b.dir = (b.dir + (b.turns[b.legIdx - 1] > 0 ? 1 : 3)) % 4;
        b.legLeft = b.legs[b.legIdx];
      } else b.phase = 'home';
    }
    if (b.trail.length > ai.maxTrail) b.phase = 'home';
  } else if (b.phase === 'hunt') {
    b.huntT++;
    const ti = b.preyI;
    if (ti === undefined || !trail[ti] || trail[ti] === b.id) b.phase = 'out';   // 사라졌다
    else if (b.huntT > ai.huntR * 2 + 20) b.phase = 'home';                      // 너무 오래 쫓았다
    else if (b.trail.length > ai.maxTrail) b.phase = 'home';
  }

  // ── 판단 주기마다 한 번씩만 다시 생각한다 (주기는 봇마다 다르다) ──
  if (b.rethink) {
    b.rethink = false;
    if (b.phase !== 'home') {
      const foe = b.threat;
      if (b.trail.length > 12 && foe < ai.flee) {
        b.phase = 'home';                        // 위험 — 치고 빠진다 (수비)
      } else if ((b.phase === 'out' || b.phase === 'hunt')
                 && b.trail.length < ai.maxTrail * 0.8
                 && (b.phase === 'hunt' || Math.random() < ai.aggr)) {
        // 사냥 중에도 주기마다 다시 조준한다. 상대가 궤적을 늘리며 다가오면
        // 더 가까운 칸이 생기는데, 처음 찍은 칸만 보고 있으면 그걸 놓친다.
        const prey = findPrey(b, ai.huntR);
        if (prey) {
          if (b.phase !== 'hunt') b.huntT = 0;
          b.phase = 'hunt';
          b.preyGx = prey.gx; b.preyGz = prey.gz; b.preyI = prey.i;
        }
      }
    }
  }

  // ── 가고 싶은 방향 순서 ──
  const order = [];
  if (b.phase === 'hunt') {
    const ddx = b.preyGx - b.gx, ddz = b.preyGz - b.gz;
    if (ddx === 0 && ddz === 0) b.phase = 'home';
    else if (Math.abs(ddx) >= Math.abs(ddz)) {
      if (ddx) order.push(ddx > 0 ? 0 : 2);
      if (ddz) order.push(ddz > 0 ? 1 : 3);
    } else {
      if (ddz) order.push(ddz > 0 ? 1 : 3);
      if (ddx) order.push(ddx > 0 ? 0 : 2);
    }
  }
  if (b.phase === 'home') {
    if (b.trail.length > ai.maxTrail + 80) retargetHome(b);
    // 집 쪽으로 곧장 자른다. 가까운 내 땅을 찾아 궤적을 바짝 따라 돌아오면
    // 둘러싸는 면적이 얇은 띠밖에 안 나온다 — 먹는 양이 절반 이하로 떨어진다.
    const ddx = b.homeGx - b.gx, ddz = b.homeGz - b.gz;
    if (Math.abs(ddx) >= Math.abs(ddz)) {
      if (ddx) order.push(ddx > 0 ? 0 : 2);
      if (ddz) order.push(ddz > 0 ? 1 : 3);
    } else {
      if (ddz) order.push(ddz > 0 ? 1 : 3);
      if (ddx) order.push(ddx > 0 ? 0 : 2);
    }
    const rd = routeHome(b, b.gx, b.gz);          // 곧장 가는 길이 막혔을 때의 보조
    if (rd >= 0 && rd < 4) order.push(rd);
  }
  if (b.phase === 'out') order.push(b.dir, (b.dir + 1) % 4, (b.dir + 3) % 4);

  // ── 후보를 훑는다 ──
  const back = (b.dir + 2) % 4;
  const guard = b.trail.length >= 6;              // 궤적이 짧으면 갇힐 수가 없다
  for (const d of order.concat([0, 1, 2, 3])) {
    if (d === back) continue;
    const nx = b.gx + DIRS[d][0], nz = b.gz + DIRS[d][1];
    if (nx < EDGE || nz < EDGE || nx > GRID - 1 - EDGE || nz > GRID - 1 - EDGE) continue;
    if (trail[nz * GRID + nx] === b.id) continue;         // 자기 궤적 회피
    if (guard && routeHome(b, nx, nz) === -1) continue;   // 돌아올 길이 없으면 안 간다
    if (d !== b.dir && b.phase === 'out') b.legLeft = 0;  // 피해서 꺾었으면 이 변은 끝
    b.dir = d; b.tgx = nx; b.tgz = nz;
    if (b.phase === 'out') b.legLeft--;
    return;
  }

  // ── 사방이 막혔다. 남의 궤적이 옆에 있으면 그쪽으로 간다 — 내가 죽는 대신 상대를 잡는다 ──
  for (let d = 0; d < 4; d++) {
    const nx = b.gx + DIRS[d][0], nz = b.gz + DIRS[d][1];
    if (!inGrid(nx, nz)) continue;
    const t = trail[nz * GRID + nx];
    if (t && t !== b.id) { b.dir = d; b.tgx = nx; b.tgz = nz; return; }
  }
  // 복귀 경로 검사를 포기하고라도 내 궤적이 아닌 칸으로 간다
  for (let d = 0; d < 4; d++) {
    const nx = b.gx + DIRS[d][0], nz = b.gz + DIRS[d][1];
    if (!inGrid(nx, nz) || trail[nz * GRID + nx] === b.id) continue;
    b.dir = d; b.tgx = nx; b.tgz = nz; return;
  }
  // 정말로 사방이 내 궤적이다 (여기까지 오면 자멸을 피할 수 없다)
  const nx = b.gx + DIRS[back][0], nz = b.gz + DIRS[back][1];
  b.dir = back;
  b.tgx = Math.max(0, Math.min(GRID - 1, nx));
  b.tgz = Math.max(0, Math.min(GRID - 1, nz));
}

// ── 달리기 ──────────────────────────────────────────────
// 지금 얼마나 급한가를 0~1로 매긴다. 봇마다 '달리기 적극성'이 달라서
// 같은 상황에서도 어떤 봇은 달리고 어떤 봇은 걷는다.
function urgency(b, ai) {
  if (b.phase === 'hunt') {
    const d = Math.abs(b.preyGx - b.gx) + Math.abs(b.preyGz - b.gz);
    return d > 4 ? 0.9 : 0.3;      // 붙었으면 천천히 — 마지막 한 칸은 정확히 밟아야 한다
  }
  if (b.phase === 'home') {
    // 길게 늘어놓았거나 적이 내 궤적에 붙었으면 전력으로 집에 붙는다
    if (b.trail.length > 60 || b.threat < ai.flee) return 0.85;
    return 0.4;
  }
  return 0.1;                      // 평시 확장 — 급할 것 없다
}

// 달리면 같은 시간에 더 많은 칸을 지나므로 판단할 틈이 그만큼 줄어든다.
// 그래서 '앞이 트여 있을 때만' 달린다. 앞쪽에 내 궤적이나 벽이 있으면 미리 걷기로 줄인다.
const LOOK_RUN = 4;                // 달릴 때 미리 보는 칸 수

function pathClear(b) {
  for (let n = 1; n <= LOOK_RUN; n++) {
    const nx = b.gx + DIRS[b.dir][0] * n, nz = b.gz + DIRS[b.dir][1] * n;
    if (nx < EDGE || nz < EDGE || nx > GRID - 1 - EDGE || nz > GRID - 1 - EDGE) return false;
    if (trail[nz * GRID + nx] === b.id) return false;
  }
  return true;
}

function stepBot(b, dt) {
  if (!b.alive) return;
  if (!b.ai) assignBrains();
  b.think -= dt;
  if (b.think <= 0) {
    b.think = b.ai.period;
    b.rethink = true;
    b.threat = threatToTrail(b);        // 주기마다 한 번만 잰다. 매 프레임 훑으면 비싸다
  }
  if (b.phase === 'idle') { planBot(b); botPick(b); }

  // 급한 정도가 문턱을 넘고, 앞이 트여 있을 때만 달린다
  b.running = urgency(b, b.ai) >= 1 - b.ai.sprint && pathClear(b);

  const tx = wxOf(b.tgx), tz = wzOf(b.tgz);
  const dx = tx - b.x, dz = tz - b.z;
  const d = Math.hypot(dx, dz);
  const step = (b.running ? BOT_RUN : BOT_WALK) * dt;

  if (d <= step || d < 1e-4) {
    b.x = tx; b.z = tz;
    const had = b.trail.length;
    stepCell(b, b.tgx, b.tgz);
    if (!b.alive) return;
    if (had > 0 && b.trail.length === 0) b.phase = 'idle';   // 점령 완료 → 새 계획
    else botPick(b);
  } else {
    b.x += (dx / d) * step;
    b.z += (dz / d) * step;
  }
}

// ═══ 경기 초기화 ═════════════════════════════════════════
// 시작 위치는 참가 인원에 따라 정해진다. 온라인에서도 전원이 같은 배치를 쓰도록
// 인원 수만 맞으면 어느 클라이언트가 계산해도 결과가 같다.
function startCells(n) {
  const q = GRID / 4;
  if (n <= 2) return [[q, q * 2], [q * 3, q * 2]];
  if (n === 3) return [[q * 2, q], [q, q * 3], [q * 3, q * 3]];
  return [[q, q], [q * 3, q], [q, q * 3], [q * 3, q * 3]];
}

function initMatch(defs, secs, win) {
  ents = (defs || [{ name: '나', bot: false }]).slice(0, 4)
    .map((d, k) => makeEnt(k + 1, d.name, !!d.bot, d.netId));
  me = ents.find((e) => e.netId ? e.netId === myId : !e.bot) || ents[0];

  matchSecs = secs || MATCH_SEC;
  matchWin = win === undefined ? WIN_SHARE : win;

  owner.fill(0); trail.fill(0);
  const starts = startCells(ents.length);
  ents.forEach((e, k) => {
    const [gx, gz] = starts[k];
    giveBlock(e, gx | 0, gz | 0);
    e.x = wxOf(gx | 0); e.z = wzOf(gz | 0);
    e.gx = gx | 0; e.gz = gz | 0;
    e.tgx = gx | 0; e.tgz = gz | 0;
  });
  assignBrains();          // 봇마다 성격을 새로 뽑는다 — 매 판 배역이 달라진다
  paintAll();
  trailDirty = true;
  recount();
  buildScoreRows();
  matchTime = matchSecs;
  matchOver = false;
  feedEl.textContent = '';
  arena.spawn.set(me.x, EYE, me.z);
}

// ═══ 3D 반영 ═════════════════════════════════════════════
const dummy = new THREE.Object3D();

// 격자를 그대로 훑는다. 참가자별 trail 배열을 쓰면 게스트에서는 만들 수 없다
// (게스트는 셀 변경분만 받는다). 40,000칸 순회는 1ms 미만이고 궤적이 바뀔 때만 돈다.
function syncTrailMesh() {
  const mesh = arena.trailMesh;
  let n = 0;
  for (let i = 0; i < TOTAL && n < arena.cap; i++) {
    const t = trail[i];
    if (!t) continue;
    const c = SLOT_RGB[t - 1];
    const gz = (i / GRID) | 0, gx = i - gz * GRID;
    dummy.position.set(wxOf(gx), 0.45, wzOf(gz));
    dummy.updateMatrix();
    mesh.setMatrixAt(n, dummy.matrix);
    mesh.instanceColor.setXYZ(n, c[0] / 255, c[1] / 255, c[2] / 255);
    n++;
  }
  mesh.count = n;
  mesh.instanceMatrix.needsUpdate = true;
  mesh.instanceColor.needsUpdate = true;
}

function syncBodies() {
  arena.bodies.forEach((m, k) => {
    const e = ents[k];                 // 참가자가 4명 미만이면 빈 슬롯이 생긴다
    if (!e) { m.visible = false; return; }
    m.visible = e.alive && e !== me;
    if (m.visible) m.position.set(e.x, 1.1, e.z);
  });
}

// ═══ 미니맵 ══════════════════════════════════════════════
const mapEl = document.getElementById('map');
const mapCtx = mapEl.getContext('2d');
const mapBuf = document.createElement('canvas');
mapBuf.width = mapBuf.height = GRID;
const mapBufCtx = mapBuf.getContext('2d');
const mapImg = mapBufCtx.createImageData(GRID, GRID);
let mapAt = 0;

function drawMap(now) {
  if (now - mapAt < 140) return;
  mapAt = now;
  mapImg.data.set(pix);
  mapBufCtx.putImageData(mapImg, 0, 0);

  const W = mapEl.width;
  mapCtx.save();
  mapCtx.imageSmoothingEnabled = false;
  mapCtx.translate(0, W); mapCtx.scale(1, -1);      // 텍스처 행 순서를 화면 기준으로 뒤집는다
  mapCtx.drawImage(mapBuf, 0, 0, W, W);
  mapCtx.restore();

  for (const e of ents) {
    if (!e.alive) continue;
    const px = (e.x + HALF) / FIELD * W;
    const py = (e.z + HALF) / FIELD * W;
    mapCtx.fillStyle = e === me ? '#ffffff' : 'rgb(' + e.rgb.join(',') + ')';
    mapCtx.beginPath();
    mapCtx.arc(px, py, e === me ? 4 : 3, 0, Math.PI * 2);
    mapCtx.fill();
    mapCtx.strokeStyle = 'rgba(0,0,0,.6)'; mapCtx.lineWidth = 1; mapCtx.stroke();
  }
}

// ═══ 플레이어 이동 ═══════════════════════════════════════
const pos = new THREE.Vector3(0, EYE, 0);
const vel = new THREE.Vector3();
const wish = new THREE.Vector3();
let onGround = true, yaw = 0, pitch = 0;

function enterWorld(name) {
  world = WORLDS[name];
  pos.copy(world.spawn);
  vel.set(0, 0, 0);
  yaw = world.yaw; pitch = 0;
  onGround = true;
  camera.position.copy(pos);
  camera.rotation.set(pitch, yaw, 0);
}

function movePlayer(dt) {
  // 죽어 있는 동안에는 제자리다. 시신이 걸어다니면 방장이 잡아 준 리스폰 자리와 어긋나고,
  // 게스트에서는 그 어긋난 좌표가 그대로 보고돼 없는 궤적이 그어진다 (17 문서).
  if (screen === 'game' && !me.alive) {
    vel.set(0, 0, 0);
    camera.position.copy(pos);
    camera.rotation.set(pitch, yaw, 0);
    return { running: false, speed: 0 };
  }

  const sy = Math.sin(yaw), cy = Math.cos(yaw);
  const fx = -sy, fz = -cy, rx = cy, rz = -sy;

  let ix = 0, iz = 0;
  if (keys.KeyW) { ix += fx; iz += fz; }
  if (keys.KeyS) { ix -= fx; iz -= fz; }
  if (keys.KeyD) { ix += rx; iz += rz; }
  if (keys.KeyA) { ix -= rx; iz -= rz; }

  const len = Math.hypot(ix, iz);
  const running = !!(keys.ShiftLeft || keys.ShiftRight);
  const speed = running ? RUN : WALK;
  wish.set(len > 0 ? (ix / len) * speed : 0, 0, len > 0 ? (iz / len) * speed : 0);

  const a = ACCEL * dt * (onGround ? 1 : 0.5);
  vel.x += (wish.x - vel.x) * Math.min(1, a);
  vel.z += (wish.z - vel.z) * Math.min(1, a);

  if (keys.Space && onGround) { vel.y = JUMP; onGround = false; }
  vel.y -= GRAV * dt;

  pos.x += vel.x * dt; pos.z += vel.z * dt; pos.y += vel.y * dt;
  if (pos.y <= EYE) { pos.y = EYE; vel.y = 0; onGround = true; }

  const L = world.limit;
  pos.x = Math.max(-L, Math.min(L, pos.x));
  pos.z = Math.max(-L, Math.min(L, pos.z));

  camera.position.copy(pos);
  camera.rotation.set(pitch, yaw, 0);
  return { running, speed: Math.hypot(vel.x, vel.z) };
}

// ═══ 경기 진행 ═══════════════════════════════════════════
function stepMatch(dt) {
  if (matchOver) return;
  if (online && !iamHost) return;      // 게스트는 방장이 보낸 결과만 그린다

  if (me.alive) {
    me.x = pos.x; me.z = pos.z;
    stepCells(me, gxOf(pos.x), gzOf(pos.z));
  }
  for (const e of ents) {
    if (e === me || !e.alive) continue;
    if (e.bot) stepBot(e, dt);
    else stepCells(e, gxOf(e.x), gzOf(e.z));   // 온라인 상대 — 보고 사이 칸까지 메운다
  }

  for (const e of ents) {
    if (e.alive) continue;
    e.respawn -= dt;
    if (e.respawn <= 0) respawnEnt(e);
  }

  matchTime -= dt;
  const leader = ents.reduce((a, b) => (b.cells > a.cells ? b : a), ents[0]);
  if (matchTime <= 0 || (matchWin > 0 && share(leader) >= matchWin)) endMatch(leader);
}

function endMatch() {
  if (matchOver) return;
  matchOver = true;
  recount();

  if (online && iamHost) {
    const cells = [];
    for (const i of dirtySet) cells.push(i, owner[i] | (trail[i] << 3));
    dirtySet.clear();
    send({ t: 'relay', data: { k: 'e', t: 0, e: entPayload(), c: cells } });
    send({ t: 'end_game' });
  }
  const rank = ents.slice().sort((a, b) => b.cells - a.cells);
  const winner = rank[0];

  document.getElementById('result-title').textContent = winner === me ? '승리!' : '패배';
  document.getElementById('result-sub').textContent = matchTime <= 0
    ? '제한시간 종료'
    : winner.name + ' 이(가) ' + Math.round(matchWin * 100) + '%를 점령했습니다';
  document.getElementById('btn-result-menu').textContent = online ? '방 나가기' : '메뉴로';

  const list = document.getElementById('result-rank');
  list.textContent = '';
  rank.forEach((e, k) => {
    const row = document.createElement('div');
    row.className = 'row' + (e === me ? ' me' : '');
    const no = document.createElement('span'); no.className = 'no'; no.textContent = (k + 1) + '.';
    const dot = document.createElement('span'); dot.className = 'dot';
    dot.style.background = CSS_COLOR[e.id - 1];
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = e.name;
    const pc = document.createElement('span'); pc.className = 'pc';
    pc.textContent = (share(e) * 100).toFixed(1) + '%';
    row.append(no, dot, nm, pc);
    list.appendChild(row);
  });

  showScreen('result');
}

const toastEl = document.getElementById('toast');

// ═══ 온라인 대전 (host-authoritative) ════════════════════
// 방장이 전부 계산하고, 서버는 중계만 한다. 게스트는 자기 입력만 올리고 결과를 그린다.
//   방장 → 전원 : {k:'s'} 상태 스냅샷 (약 18Hz)
//   게스트 → 방장 : {k:'i'} 내 위치
//   방장 → 전원 : {k:'e'} 종료
const TICK_MS = 55;              // 약 18Hz. 정확성 우선이라 보간은 넣지 않았다
const CELLS_PER_TICK = 2500;     // 한 번에 보낼 셀 상한 (큰 점령은 여러 틱에 나눠 보낸다)

let online = false;              // 온라인 경기 중인가
let pendingFeed = [];            // 방장이 아직 안 보낸 킬로그
let netNow = 0, netStartedAt = -1;   // 온라인 판정에 쓰는 시계 하나 (루프가 주는 시각)
let tickAt = 0;

function entBySlot(id) { return ents.find((e) => e.id === id); }

function entPayload() {
  return ents.map((e) => [e.id, Math.round(e.x * 20) / 20, Math.round(e.z * 20) / 20,
                          e.alive ? 1 : 0, e.cells, e.deaths]);
}

function netStartMatch(room, members) {
  online = true;
  iamHost = room.host === myId;
  const defs = members.map((m) => ({ name: m.name, netId: m.id }));
  initMatch(defs, room.secs, room.win ? room.win / 100 : 0);
  collectDirty = iamHost;
  dirtySet.clear();
  pendingFeed = [];
  tickAt = 0;
  netNow = 0; netStartedAt = -1;
  for (const e of ents) { e.seen = 0; e.waiting = false; }    // 참가 유예는 첫 틱에서 시작한다

  showScreen('game');
  // 방장은 [게임 시작] 클릭이 곧 사용자 조작이라 바로 잠글 수 있다.
  // 게스트는 네트워크 메시지로 들어오는 것이라 브라우저가 잠금을 거부한다 → 클릭을 받아야 한다.
  if (iamHost) {
    requestLock();
    setTimeout(() => { if (screen === 'game' && !locked) joinPrompt(); }, 400);
  } else {
    joinPrompt();
  }
  toast(iamHost ? '경기 시작 — 내가 방장(계산 담당)입니다' : '경기가 시작되었습니다');
}

function joinPrompt() {
  showPause(true, '경기 시작!', '화면을 클릭하면 참가합니다', '참가하기');
}

function netEndMatch() {
  online = false;
  collectDirty = false;
  dirtySet.clear();
}

// 방장: 상태를 모아 보낸다
function hostTick(now) {
  netNow = now;
  if (netStartedAt < 0) {                       // 첫 틱을 기준으로 참가 유예를 센다
    netStartedAt = now;
    for (const e of ents) e.seen = now;
  }
  if (now - tickAt < TICK_MS) return;
  tickAt = now;
  checkSilent(now);

  const cells = [];
  if (dirtySet.size) {
    let n = 0;
    for (const i of dirtySet) {
      cells.push(i, owner[i] | (trail[i] << 3));
      dirtySet.delete(i);
      if (++n >= CELLS_PER_TICK) break;
    }
  }

  const payload = { k: 's', t: Math.max(0, matchTime), e: entPayload(), c: cells };
  if (pendingFeed.length) { payload.f = pendingFeed; pendingFeed = []; }
  send({ t: 'relay', data: payload });
}

// 게스트: 내 위치를 올린다
function guestTick(now) {
  if (now - tickAt < TICK_MS) return;
  tickAt = now;
  // n = 내가 아는 내 사망 횟수. 방장이 나를 리스폰시킨 직후에는 아직 옛 좌표를 들고 있는데,
  // 그걸 그대로 받아 주면 방장이 시작 칸에서 죽은 자리까지 없는 궤적을 그어 버린다.
  // r = 내가 조작 가능한 상태인가. 창이 뒤로 밀리거나 [참가하기]를 아직 안 눌렀으면 0이다.
  // 이걸 안 보내면 방장은 "가만히 서 있는 사람"과 "아직 못 들어온 사람"을 구분하지 못한다.
  send({ t: 'relay', data: { k: 'i', n: me.deaths, r: locked ? 1 : 0,
                             x: Math.round(pos.x * 20) / 20, z: Math.round(pos.z * 20) / 20 } });
}

// 게스트: 방장이 보낸 상태를 그대로 반영한다
function applyState(d) {
  matchTime = d.t;
  for (const a of d.e) {
    const e = entBySlot(a[0]);
    if (!e) continue;
    const [, x, z, alive, cells, deaths] = a;
    const was = e.alive;
    e.cells = cells;
    e.alive = !!alive;
    if (e === me) {
      // 죽었을 때와 되살아났을 때 둘 다 방장이 찍어 준 자리로 옮겨간다.
      // 되살아남을 안 보면 죽은 자리에 그대로 서 있게 되고, 방장은 시작 칸에
      // 세워 둔 나와 어긋난 좌표를 받아 없는 궤적을 긋는다 (17 문서).
      if (deaths !== e.deaths || (!was && e.alive)) {
        e.deaths = deaths;
        pos.set(x, EYE, z); vel.set(0, 0, 0);
        camera.position.copy(pos);
      }
      e.x = pos.x; e.z = pos.z;
    } else {
      e.x = x; e.z = z; e.deaths = deaths;
    }
  }
  if (d.c && d.c.length) {
    for (let k = 0; k < d.c.length; k += 2) {
      const i = d.c[k], v = d.c[k + 1];
      owner[i] = v & 7;
      trail[i] = (v >> 3) & 7;
      paint(i);
    }
    trailDirty = true;
  }
  if (d.f) for (const [slot, why] of d.f) { const e = entBySlot(slot); if (e) pushFeed(e, why); }
}

// 방장: 상대가 보낸 위치를 반영한다.
// netId는 참가자마다 다르므로 게스트가 여럿이어도 각자 다른 ent로 간다.
function applyInput(fromId, d) {
  const e = ents.find((x) => x.netId === fromId);
  if (!e) return;
  e.seen = netNow;                                 // 이 사람은 살아서 보고 중이다
  setWaiting(e, d.r !== undefined && !d.r, '조작 대기 중 — 화면을 클릭해야 움직입니다');
  if (!e.alive) return;
  if (d.n !== undefined && d.n !== e.deaths) return;   // 죽기 전 좌표 — 버린다
  if (e.warpT && netNow < e.warpT) {
    // 방금 리스폰시켰다. 상대는 아직 옛 자리를 들고 있으므로, 리스폰 칸 근처 보고가
    // 올 때까지 기다린다. 안 그러면 시작 칸에서 죽은 자리까지 없는 선이 그어진다.
    const dd = Math.abs(gxOf(d.x) - e.gx) + Math.abs(gzOf(d.z) - e.gz);
    if (dd > 3) return;
    e.warpT = 0;
  }
  e.x = d.x; e.z = d.z;
}

// 킬로그에 남기고 게스트에게도 같이 보낸다
function hostFeed(e, why) {
  pushFeed(e, why);
  if (online && iamHost) pendingFeed.push([e.id, why]);
}

// 보고가 끊긴 참가자를 드러낸다. 화면을 클릭하지 않은 게스트는 아무것도 못 보내는데,
// 그대로 두면 "저 사람만 궤적이 안 생긴다"는 버그로 보인다. 이유를 띄워 준다.
const SILENT_MS = 3000;

function setWaiting(e, on, why) {
  if (e.waiting === on) return;
  e.waiting = on;
  hostFeed(e, on ? why : '참가했습니다');
}

function checkSilent(now) {
  for (const e of ents) {
    if (e === me || e.bot || !e.netId) continue;
    if (now - e.seen > SILENT_MS) setWaiting(e, true, '응답 없음 — 연결을 확인하세요');
  }
}

// ═══ 킬로그 ═════════════════════════════════════════════
// "왜 갑자기 사라졌는지"가 안 보이면 버그처럼 느껴진다. 사유를 남겨 준다.
const feedEl = document.getElementById('feed');

function pushFeed(ent, reason) {
  const row = document.createElement('div');
  row.className = 'f';
  const nm = document.createElement('span');
  nm.className = 'nm';
  nm.style.color = CSS_COLOR[ent.id - 1];
  nm.textContent = ent.name;
  const why = document.createElement('span');
  why.className = 'why';
  why.textContent = ' — ' + reason;
  row.append(nm, why);
  feedEl.prepend(row);
  while (feedEl.children.length > 4) feedEl.lastChild.remove();
  setTimeout(() => row.remove(), 6000);
}

// ═══ 네트워크 (방 서버) ═════════════════════════════════
// 서버는 방 관리와 중계만 한다. 게임 계산은 방장 클라이언트가 맡는다(마일스톤 C).
const WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/game/ws';
const netEl = document.getElementById('netstate');

let sock = null, myId = null, myRoom = null, iamHost = false, netOk = false;
let retryAt = 0, retryTimer = 0, wantNet = false;

function myName() {
  let n = null;
  try { n = localStorage.getItem('lg.name'); } catch (e) { n = null; }
  if (!n) {
    n = '플레이어-' + (1000 + Math.floor(Math.random() * 9000));
    try { localStorage.setItem('lg.name', n); } catch (e) { /* 사생활 보호 모드 */ }
  }
  return n;
}

function setNet(text, cls) { netEl.textContent = text; netEl.className = cls || ''; }

function send(obj) { if (sock && sock.readyState === 1) sock.send(JSON.stringify(obj)); }

function netConnect() {
  wantNet = true;
  clearTimeout(retryTimer);
  if (sock && (sock.readyState === 0 || sock.readyState === 1)) return;
  setNet(retryAt ? '재연결 중…' : '연결 중…', '');
  try { sock = new WebSocket(WS_URL); } catch (e) { setNet('연결 실패', 'bad'); return; }

  sock.onopen = () => {
    netOk = true; retryAt = 0;
    setNet('온라인 연결됨', 'ok');
    send({ t: 'hello', name: myName() });
  };
  sock.onmessage = (ev) => { let m; try { m = JSON.parse(ev.data); } catch (e) { return; } onNet(m); };
  sock.onerror = () => setNet('연결 오류', 'bad');
  sock.onclose = () => {
    netOk = false;
    sock = null;
    renderRooms([]);
    if (screen === 'room' || screen === 'create') {
      myRoom = null;
      toast('서버와 연결이 끊겼습니다');
      enter3d('lobby');
    }
    if (!wantNet) { setNet('연결 종료', 'bad'); return; }
    // 1 → 2 → 4 → 8초로 늘려가며 재접속한다
    retryAt = retryAt ? Math.min(retryAt * 2, 8000) : 1000;
    setNet('연결 끊김 — ' + (retryAt / 1000) + '초 후 재연결', 'bad');
    clearTimeout(retryTimer);
    retryTimer = setTimeout(netConnect, retryAt);
  };
}

function netClose() {
  wantNet = false;
  retryAt = 0;
  clearTimeout(retryTimer);
  if (sock) { try { sock.close(); } catch (e) { /* 이미 닫힘 */ } sock = null; }
  netOk = false; myRoom = null;
}

function onNet(m) {
  if (m.t === 'welcome') myId = m.id;
  else if (m.t === 'room_list') renderRooms(m.rooms);
  else if (m.t === 'joined') { myRoom = m.room; iamHost = m.you === 'host'; showScreen('room'); updateRoomPanel(m.room, null); }
  else if (m.t === 'room_update') {
    myRoom = m.room;
    iamHost = m.room.host === myId;
    updateRoomPanel(m.room, m.members);
  }
  else if (m.t === 'host_changed') {
    const wasOnlineMatch = online && !matchOver;
    iamHost = m.host === myId;
    toast(iamHost ? '내가 방장이 되었습니다' : m.name + ' 님이 방장이 되었습니다');
    if (wasOnlineMatch) {
      // 계산 담당이 나갔다. 이어받을 상태가 없으므로 거기서 끝낸다.
      toast('방장이 나가 경기가 종료되었습니다');
      endMatch();
    }
  }
  else if (m.t === 'peer') {
    toast(m.name + (m.event === 'join' ? ' 님이 들어왔습니다' : ' 님이 나갔습니다'));
    if (online && m.event === 'leave') {
      const e = ents.find((x) => x.netId === m.id);
      if (e && e.alive) { e.alive = false; e.respawn = 1e9; clearTrailOf(e); recount(); pushFeed(e, '접속 종료'); }
    }
  }
  else if (m.t === 'game_start') netStartMatch(m.room, m.members);
  else if (m.t === 'game_end') { if (online && !matchOver) { netEndMatch(); toast('경기가 종료되었습니다'); showScreen('room'); } }
  else if (m.t === 'relay') {
    const d = m.data;
    if (!d || !online) return;
    if (d.k === 's' && !iamHost) applyState(d);
    else if (d.k === 'i' && iamHost) applyInput(m.from, d);
    else if (d.k === 'e' && !iamHost) { applyState(d); endMatch(); }
  }
  else if (m.t === 'left') myRoom = null;
  else if (m.t === 'error') toast(m.msg);
}

// 서버가 준 목록을 3D 문 슬롯에 반영한다
function renderRooms(list) {
  const lob = WORLDS.lobby;
  const spots = [lob.createSpot];
  const gap = 8.2, n = Math.min(list.length, lob.slots.length);
  const startX = -gap * (n - 1) / 2;
  lob.slots.forEach((slot, i) => {
    const r = i < n ? list[i] : null;
    slot.room = r || null;
    setSlotVisible(slot, !!r);
    if (!r) return;
    // 보이는 방 개수에 맞춰 가운데 정렬
    const x = startX + gap * i;
    slot.x = x;
    slot.pad.position.x = x;
    slot.frame.position.x = x;
    slot.face.position.x = x;
    slot.glow.position.x = x;
    slot.label.sprite.position.x = x;
    const color = STATE_COLOR[r.state] || 0x7fd18b;
    slot.pad.material.emissive.setHex(color);
    slot.face.material.color.setHex(color);
    slot.face.material.opacity = r.state === 'wait' ? .5 : .22;
    slot.glow.color.setHex(color);
    slot.glow.intensity = r.state === 'wait' ? 9 : 4;
    slot.label.draw(r.name,
      r.players + ' / ' + r.max + ' · ' + minText(r.secs) + ' · ' + STATE_TEXT[r.state],
      '#' + color.toString(16).padStart(6, '0'));
    spots.push({ kind: 'room', pos: new THREE.Vector3(slot.x, 0, slot.z),
                 text: r.state === 'play' ? '가득 참' : '입장',
                 meta: r.name + ' · ' + r.players + '/' + r.max + ' · ' + minText(r.secs) +
                       (r.win ? ' · ' + r.win + '%' : ''), room: r });
  });
  lob.spots = spots;
  if (netOk) setNet(list.length ? '온라인 연결됨 · 방 ' + list.length + '개' : '온라인 연결됨 · 열린 방 없음', 'ok');
}

function updateRoomPanel(room, members) {
  document.getElementById('room-name').textContent = room.name;
  settingEl.textContent = settingText(room);
  document.getElementById('room-note').textContent = room.players >= room.max
    ? '정원이 찼습니다 (' + room.players + ' / ' + room.max + ')'
    : '참가자를 기다리는 중… (' + room.players + ' / ' + room.max + ')';
  startBtn.style.display = iamHost ? '' : 'none';
  if (!members) return;
  const box = document.getElementById('room-members');
  box.textContent = '';
  members.forEach((mm, k) => {
    const row = document.createElement('div');
    row.className = 'row' + (mm.id === myId ? ' me' : '');
    const no = document.createElement('span'); no.className = 'no'; no.textContent = (k + 1) + '.';
    const dot = document.createElement('span'); dot.className = 'dot';
    dot.style.background = CSS_COLOR[k % CSS_COLOR.length];
    const nm = document.createElement('span'); nm.className = 'nm';
    nm.textContent = mm.name + (mm.id === myId ? ' (나)' : '');
    const pc = document.createElement('span'); pc.className = 'pc';
    pc.textContent = mm.host ? '방장' : '참가';
    row.append(no, dot, nm, pc);
    box.appendChild(row);
  });
}

const createField = document.getElementById('create-name');
const startBtn = document.getElementById('btn-room-start');
const settingEl = document.getElementById('room-setting');

// 선택지 묶음 하나를 만든다. 값은 state.value 에 남는다.
function buildSeg(el, items, def) {
  const state = { value: def };
  items.forEach((it) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = it.label;
    if (it.value === def) b.classList.add('on');
    b.addEventListener('click', () => {
      state.value = it.value;
      for (const c of el.children) c.classList.toggle('on', c === b);
    });
    el.appendChild(b);
  });
  return state;
}

const optMax = buildSeg(document.getElementById('opt-max'),
  [{ label: '2명', value: 2 }, { label: '3명', value: 3 }, { label: '4명', value: 4 }], 2);
const optSecs = buildSeg(document.getElementById('opt-secs'),
  [{ label: '1분', value: 60 }, { label: '2분', value: 120 },
   { label: '3분', value: 180 }, { label: '5분', value: 300 }], 180);
const optWin = buildSeg(document.getElementById('opt-win'),
  [{ label: '60%', value: 60 }, { label: '없음', value: 0 }], 60);

const minText = (secs) => (secs / 60) + '분';

function settingText(room) {
  return '인원 ' + room.max + '명 · 제한 ' + minText(room.secs) +
         ' · 승리 ' + (room.win ? room.win + '%' : '시간 종료까지');
}

function openCreateDialog() {
  if (!netOk) { toast('서버에 연결되어 있지 않습니다'); return; }
  showScreen('create');                 // 포인터 잠금이 풀려야 글자를 칠 수 있다
  createField.value = myName() + '의 방';
  setTimeout(() => { createField.focus(); createField.select(); }, 30);
}

function submitCreate() {
  const name = createField.value.trim().slice(0, 20) || (myName() + '의 방');
  send({ t: 'create_room', name, max: optMax.value, secs: optSecs.value,
         win: optWin.value === 60 ? 60 : null });
}

function leaveRoom() {
  netEndMatch();
  send({ t: 'leave' });
  myRoom = null;
  enter3d('lobby');
}

// ═══ 로비 상호작용 ═══════════════════════════════════════
let nearSpot = null;

function updateInteract() {
  if (screen !== 'lobby' || paused) { nearSpot = null; promptEl.classList.remove('on'); return; }
  let best = null, bestD = Infinity;
  for (const s of world.spots) {
    const d = Math.hypot(s.pos.x - pos.x, s.pos.z - pos.z);
    if (d < REACH && d < bestD) { bestD = d; best = s; }
  }
  if (best !== nearSpot) {
    nearSpot = best;
    if (best) { promptText.textContent = best.text; promptMeta.textContent = best.meta; }
  }
  promptEl.classList.toggle('on', !!best);
}

function interact() {
  if (!nearSpot) return;
  if (!netOk) { toast('서버에 연결되어 있지 않습니다'); return; }
  if (nearSpot.kind === 'create') { openCreateDialog(); return; }
  const r = nearSpot.room;
  if (!r) return;
  if (r.players >= r.max) { toast('방이 가득 찼습니다'); return; }
  send({ t: 'join', room: r.id });
}

// ═══ 버튼 ════════════════════════════════════════════════
document.getElementById('btn-bot').addEventListener('click', () => enter3d('game'));
document.getElementById('btn-online').addEventListener('click', () => { netConnect(); enter3d('lobby'); });
document.getElementById('btn-room-leave').addEventListener('click', leaveRoom);
document.getElementById('btn-create-ok').addEventListener('click', submitCreate);
startBtn.addEventListener('click', () => {
  if (!myRoom) return;
  if (myRoom.players < myRoom.max) { toast('아직 정원이 차지 않았습니다 (' + myRoom.players + '/' + myRoom.max + ')'); return; }
  send({ t: 'start_game' });
});
document.getElementById('btn-create-cancel').addEventListener('click', () => enter3d('lobby'));
createField.addEventListener('keydown', (e) => {
  e.stopPropagation();                        // 입력 중 키가 게임 조작으로 새지 않게
  if (e.key === 'Enter') submitCreate();
  if (e.key === 'Escape') enter3d('lobby');
});
resumeBtn.addEventListener('click', requestLock);
SCREENS.pause.addEventListener('click', (e) => {
  if (e.target.closest('.btn')) return;   // 버튼은 각자 처리
  requestLock();
});
document.getElementById('btn-tomenu').addEventListener('click', () => showScreen('menu'));
document.getElementById('btn-again').addEventListener('click', () => {
  if (online) {
    if (iamHost) send({ t: 'start_game' });
    else toast('방장이 다시 시작할 수 있습니다');
    return;
  }
  enter3d('game');
});
document.getElementById('btn-result-menu').addEventListener('click', () => {
  if (online) { netEndMatch(); leaveRoom(); return; }
  showScreen('menu');
});

// ═══ 입력 ════════════════════════════════════════════════
const keys = Object.create(null);
function clearKeys() { for (const k in keys) keys[k] = false; }

addEventListener('keydown', (e) => {
  if (e.code === 'Escape') {
    if (locked) return;
    if (screen === 'create') enter3d('lobby');
    else if (screen === 'room') leaveRoom();
    else if (screen === 'lobby') showScreen('menu');
    else if (screen === 'game') showPause(true);
    return;
  }
  if (screen === 'menu' || screen === 'result' || screen === 'room' || screen === 'create' || paused) return;
  if (e.code === 'KeyE' && screen === 'lobby') { interact(); return; }
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', (e) => { keys[e.code] = false; });
addEventListener('blur', clearKeys);

document.addEventListener('mousemove', (e) => {
  if (!locked) return;
  yaw -= e.movementX * SENS;
  pitch -= e.movementY * SENS;
  const LIM = Math.PI / 2 - 0.001;
  pitch = Math.max(-LIM, Math.min(LIM, pitch));
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ═══ HUD ═════════════════════════════════════════════════
const stat = document.getElementById('stat');
let hudAt = 0, frames = 0, fpsAt = 0, fps = 0;
let scoreRows = [];

function buildScoreRows() {
  scoreEl.textContent = '';
  scoreRows = ents.map((e) => {
    const row = document.createElement('div');
    row.className = 'r' + (e === me ? ' me' : '');
    const dot = document.createElement('span'); dot.className = 'dot';
    dot.style.background = CSS_COLOR[e.id - 1];
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = e.name;
    const pc = document.createElement('span'); pc.className = 'pc';
    row.append(dot, nm, pc);
    scoreEl.appendChild(row);
    return { ent: e, row, pc };
  });
}

function drawHud(now, s) {
  frames++;
  if (now - fpsAt >= 500) { fps = Math.round((frames * 1000) / (now - fpsAt)); frames = 0; fpsAt = now; }
  if (screen === 'menu' || now - hudAt < 100) return;
  hudAt = now;

  if (screen === 'game') {
    const rank = ents.slice().sort((a, b) => b.cells - a.cells);
    scoreRows.forEach((r) => {
      r.pc.textContent = (share(r.ent) * 100).toFixed(1) + '%';
      r.row.classList.toggle('dead', !r.ent.alive);
      r.row.style.order = rank.indexOf(r.ent);
    });
    const t = Math.max(0, matchTime);
    const m = (t / 60) | 0, sec = (t % 60) | 0;
    timerEl.textContent = m + ':' + String(sec).padStart(2, '0');
    timerEl.classList.toggle('warn', t <= 30);
    const tl = me.trail.length;
    const warn = tl ? ' · 궤적 ' + tl + '칸' : '';   // 길다고 죽지는 않는다. 대신 봇이 노린다
    stat.textContent = '내 순위 ' + (rank.indexOf(me) + 1) + '위 · ' +
      (share(me) * 100).toFixed(1) + '% · ' + s.speed.toFixed(1) + ' m/s' + warn + ' · ' + fps + ' fps';
  } else {
    stat.textContent = s.speed.toFixed(1) + ' m/s · ' + fps + ' fps';
  }
}

// ═══ 루프 ════════════════════════════════════════════════
let prev = performance.now();

function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - prev) / 1000, MAXDT);
  prev = now;

  const active = (screen === 'game' || screen === 'lobby') && locked;
  const s = active ? movePlayer(dt) : { running: false, speed: 0 };

  // 온라인 방장은 전원의 판정을 맡는다. 내 포인터 잠금이 풀렸다고(다른 창 클릭·ESC·탭 전환)
  // 멈춰버리면 게스트의 궤적·점령·타이머가 통째로 멎는다. 방장은 잠금과 무관하게 계속 돈다.
  if (screen === 'game' && (active || (online && iamHost && !matchOver))) stepMatch(dt);
  if (online && screen === 'game' && !matchOver) {
    // 게스트의 위치 보고를 포인터 잠금에 묶으면 안 된다. 창이 뒤로 밀리거나
    // [참가하기]를 아직 안 누른 게스트는 방장에게 아무 것도 못 보내고,
    // 방장은 그 사람을 시작 칸에 세워 둔 채로 판단한다 → 궤적이 통째로 안 생긴다.
    if (iamHost) hostTick(now); else guestTick(now);
  }
  if (screen === 'game') {
    if (trailDirty) { syncTrailMesh(); trailDirty = false; }
    syncBodies();
    if (texDirty) { gridTex.needsUpdate = true; texDirty = false; }
    drawMap(now);
  }

  updateInteract();
  drawHud(now, s);
  renderer.render(world.scene, camera);
}
requestAnimationFrame(loop);

showScreen('menu');

addEventListener('error', (e) => {
  const box = document.getElementById('err');
  box.style.display = 'flex';
  box.textContent = '로딩 오류: ' + (e.message || '알 수 없음') + ' — 새로고침하거나 네트워크를 확인하세요.';
});
</script>
</body>
</html>
